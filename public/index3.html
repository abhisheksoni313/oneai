<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OneAI</title>
<link rel="icon" type="image/png" href="assets/oneai-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;color-scheme:light;--bg:#fff;--bg2:#f6f8fd;--ink:#0b1f4b;--mute:#5b678a;--line:#e1e6f2;--red:#ff3d71;--blue:#4f5bff;--ok:#0c8a4f;--warn:#b86e00;--bad:#b42318}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}.brand{display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:0}.brand img{height:30px;width:auto;display:block;object-fit:contain}.sp{flex:1}nav{display:flex;gap:4px;margin-left:8px}nav a{padding:7px 10px;border-radius:8px;color:var(--mute);font-weight:600;cursor:pointer}nav a.on{background:var(--bg2);color:var(--ink)}.wal{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;background:var(--bg2)}
.btn{background:linear-gradient(90deg,var(--red),#ff7a45,var(--blue));background-size:200%;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;transition:.18s}.btn:hover:not(:disabled){transform:translateY(-1px);background-position:100% 0}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.s{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 12px;font-size:13px}
main{max-width:1080px;margin:0 auto;padding:22px 16px 64px}.hero{position:relative;display:grid;grid-template-columns:1.08fr .92fr;gap:24px;align-items:center;text-align:left;padding:34px 4px 12px;overflow:hidden;border-radius:28px}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,70%) var(--my,30%),rgba(79,91,255,.12),transparent 70%);pointer-events:none}.hl{position:relative;z-index:1}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:14px 0;letter-spacing:-.035em}.hero p{color:var(--mute);max-width:650px;margin:0 0 22px}.pill{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px}.gr{background:linear-gradient(90deg,var(--red),var(--blue),var(--red));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.sb{display:flex;gap:8px;border:2px solid var(--ink);border-radius:16px;padding:6px;background:#fff}.sb input{flex:1;border:0;outline:0;background:none;padding:10px 12px;font-size:16px;min-width:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:600}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.orb{position:relative;width:370px;height:370px;max-width:100%;margin:0 auto;z-index:1}.core{position:absolute;left:50%;top:50%;width:166px;height:92px;transform:translate(-50%,-50%);border-radius:20px;background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 0 0 12px rgba(79,91,255,.08),0 16px 38px -18px rgba(79,91,255,.55);animation:pl 3s ease-in-out infinite;border:1px solid var(--line);z-index:3;overflow:hidden}.core img{position:absolute;left:50%;top:50%;display:block;width:108px;max-width:72%;height:auto;object-fit:contain;object-position:center;transform:translate(-50%,-50%);margin:0}.ring{position:absolute;left:50%;top:50%;translate:-50% -50%;border:1px dashed #c9d0ee;border-radius:50%;animation:spin linear infinite}.ib{position:absolute;width:48px;height:48px;margin:-24px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(11,31,75,.18);animation:spin linear infinite;border:1px solid var(--line)}.ib img{width:36px;height:36px;object-fit:contain;border-radius:9px}.ib:hover{scale:1.2}.orb:hover .ring,.orb:hover .ib{animation-play-state:paused}
.mq{overflow:hidden;border-block:1px solid var(--line);margin:14px 0;padding:10px 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}.mt{display:flex;gap:34px;width:max-content;animation:mq 30s linear infinite}.mt span{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}.mt img{width:26px;height:26px;object-fit:contain;border-radius:7px}.mt em{font-style:normal;font-weight:400;color:var(--mute);font-size:13px}.mq:hover .mt{animation-play-state:paused}
h1{letter-spacing:-.02em}h2{font-size:21px;margin:32px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:7px;transition:.2s}.card:hover{box-shadow:0 14px 34px -18px rgba(79,91,255,.46);border-color:#aeb6ff}.card.top{border:2px solid var(--blue)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolimg{width:38px;height:38px;object-fit:contain;border-radius:10px;background:#fff}.toolimg.big{width:58px;height:58px;border:1px solid var(--line);padding:5px}.card h3{margin:0;font-size:17px}.mute{color:var(--mute);font-size:13px}.tiny{font-size:12px}.status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}.status.live{color:var(--ok);border-color:#9bd4b9;background:#f0fbf5}.status.fallback{color:#5d52c8;border-color:#cbc6ff;background:#f7f5ff}.status.need{color:var(--warn);border-color:#f2cf9b;background:#fff9ef}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}.f,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px}.est{background:var(--bg2);border-radius:14px;padding:16px;position:sticky;top:86px}.big{font-size:30px;font-weight:800}.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bal div{background:var(--bg2);border-radius:14px;padding:14px}.bal b{font-size:24px;display:block}.sc{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--blue),var(--red),var(--blue));background-size:200%;animation:sh 1s linear infinite;transition:width .5s}.rcpt{border:1px dashed var(--ink);border-radius:14px;padding:14px;margin-top:14px}.rcpt div{display:flex;justify-content:space-between;gap:20px;padding:3px 0}.outlinks{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{padding:12px 14px;border-radius:12px;background:#fff9ef;border:1px solid #f2cf9b;color:#6e4b00}.okbox{padding:12px 14px;border-radius:12px;background:#f0fbf5;border:1px solid #b9e4cc;color:#075f38}.err{padding:12px 14px;border-radius:12px;background:#fff1f0;border:1px solid #f4b9b4;color:#8a1911;white-space:pre-wrap}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.15)}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg2);border-radius:14px;padding:12px 14px}.flow .t{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:700;cursor:pointer}.empty{padding:30px;text-align:center;background:var(--bg2);border-radius:16px;color:var(--mute)}.command-wrap{margin:16px 0 4px}.command-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;box-shadow:0 10px 30px -24px rgba(79,91,255,.5)}.command-answer{white-space:pre-wrap;line-height:1.65;margin-top:10px}.sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.source{display:inline-flex;align-items:center;max-width:100%;padding:6px 10px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;font-size:12px;color:var(--ink)}.command-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.emailmini{margin-top:8px;display:flex;gap:8px;align-items:center}.emailmini input{max-width:340px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}.searchhelp{font-size:12px;color:var(--mute);margin-top:7px}.route-chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f7f5ff;border:1px solid #cbc6ff;color:#5d52c8}footer{text-align:center;color:var(--mute);font-size:12px;padding:0 16px 28px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pl{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}@keyframes sh{to{background-position:200% 0}}@keyframes mq{to{transform:translateX(-50%)}}
@media(max-width:820px){.hero{grid-template-columns:1fr}.orb{transform:scale(.88);margin-top:-20px;margin-bottom:-20px}.two{grid-template-columns:1fr}.est{position:static}}@media(max-width:650px){nav{order:5;width:100%;overflow-x:auto}.brand img{height:31px}.bal{grid-template-columns:1fr}.sb{flex-direction:column}.orb{width:330px;height:330px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="brand" onclick="go('')"><img src="assets/oneai-logo.png" alt="OneAI"></span>
  <nav id="nav"></nav><span class="sp"></span>
  <span class="wal" id="wal">Loading…</span><button class="btn sm" onclick="go('wallet')">Top up</button>
</header>
<main id="app"></main>
<footer>OneAI full-stack prototype · Gemini routing and grounded search run server-side · provider keys never enter the browser.</footer>
<script>
const T=[
{s:'lovable',n:'Lovable',c:'Build',d:'Turn a brief into a working single-file web app.',w:'Best for turning an idea into a downloadable MVP.',unit:'~30 credits/build',tags:['mvp','app','website','build','prototype','startup'],f:[['brief','What should we build?','area','A study-group planner app for college students'],['stack','Style','sel',['Clean & minimal','Playful','Dark mode']]]},
{s:'chatprd',n:'ChatPRD',c:'Product',d:'Generate an implementation-ready product requirements document.',w:'Writes a structured PRD from your idea, user and goals.',unit:'~15 credits/doc',tags:['prd','product','requirements','spec','roadmap','startup'],f:[['idea','Product idea','area','Group study planner'],['user','Target user','text','College students'],['tpl','Template','sel',['Lean PRD','Full PRD','One-pager']]]},
{s:'gamma',n:'Gamma',c:'Presentations',d:'Create a presentation and return a downloadable PPTX.',w:'Uses Gamma when configured, otherwise a Gemini-powered PPTX route.',unit:'~3 credits/slide',tags:['presentation','pitch','deck','slides','report','proposal','notes'],f:[['brief','Topic or notes','area','Pitch deck for my student startup'],['n','Slides','num',10],['tone','Tone','sel',['Professional','Bold','Friendly']]]},
{s:'heygen',n:'HeyGen',c:'Video',d:'Generate an AI video from your script.',w:'Native video needs a configured HeyGen key or paid Gemini Veo fallback.',unit:'~40 credits/minute',tags:['video','avatar','launch','promo','explainer','translate'],f:[['script','Script','area','Meet OneAI: one wallet, every AI tool.'],['o','Orientation','sel',['Landscape','Portrait']]]},
{s:'elevenlabs',n:'ElevenLabs',c:'Voice',d:'Convert text into a natural downloadable voiceover.',w:'Uses ElevenLabs first, then Gemini TTS when configured.',unit:'~0.03 credits/character',tags:['voice','voiceover','audio','speech','narration','tts','script'],f:[['text','Text (max 2,000 characters)','area','Welcome to OneAI. Describe the job, we find the tool.'],['v','Voice','sel',['Default','Ravi','Meera']],['l','Language','sel',['English','Hindi','Tamil']]]},
{s:'browseai',n:'Browse AI',c:'Research & Data',d:'Extract useful structured data from a public web page.',w:'Uses Browse AI with a configured robot or a Gemini extraction fallback.',unit:'~12 credits/task',tags:['extract','scrape','research','prices','competitor','data','monitor','table'],f:[['r','Extraction task','sel',['Competitor price tracker','Job listings','Product reviews']],['u','Public page URL','text','https://example.com']]},
{s:'fireflies',n:'Fireflies',c:'Meetings',d:'Upload meeting audio/video and receive a transcript, summary and actions.',w:'The file is uploaded securely to the backend before processing.',unit:'~0.8 credits/minute',tags:['meeting','transcribe','transcript','notes','summary','audio','recording'],f:[['t','Meeting title','text','Weekly product sync'],['min','Audio length (minutes)','num',30],['meeting_file','Meeting audio/video','file','']]},
{s:'adcreative',n:'AdCreative.ai',c:'Marketing',d:'Create ad copy plus downloadable creative sizes.',w:'Gemini writes copy and OneAI renders the final image set.',unit:'~25 credits/set',tags:['ad','ads','creative','marketing','campaign','banner','launch'],f:[['p','Product description','area','OneAI wallet launch'],['h','Headline direction','text','One wallet. Every AI tool.']]},
{s:'typefully',n:'Typefully',c:'Social',d:'Create a polished social draft ready to edit or schedule.',w:'Uses Typefully when configured; otherwise returns a downloadable draft.',unit:'~2 credits/draft',tags:['social','post','tweet','thread','schedule','campaign','linkedin'],f:[['x','Post text','area','OneAI launches today: one wallet for every AI tool.'],['nw','Network','sel',['X','LinkedIn','Threads']]]}
];
const CATS=[...new Set(T.map(t=>t.c))];
const FLOWS=[{n:'Founder launch',trig:['startup','mvp','pitch','launch my'],steps:['chatprd','lovable','gamma']},{n:'Campaign launch',trig:['campaign','video and social','launch video','ad creative'],steps:['adcreative','heygen','typefully']}];
const STOP='a an the my for to of and with me i want need make create build turn into this that from on in it is am'.split(' ');
const state={view:'',slug:'',q:'',cat:'',wallet:null,status:{},email:localStorage.getItem('oneai_email')||'',running:null,command:null,commandRun:null};
const uid=(()=>{let v=localStorage.getItem('oneai_user');if(!v){v='web-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).toString().replace(/[^a-zA-Z0-9-]/g,'');localStorage.setItem('oneai_user',v)}return v})();
const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'X-OneAI-User':uid};const r=await fetch(path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok){const msg=typeof d.detail==='object'?(d.detail.message||JSON.stringify(d.detail)):(d.detail||d.message||`HTTP ${r.status}`);throw Object.assign(new Error(msg),{status:r.status,data:d})}return d};
const tool=s=>T.find(t=>t.s===s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
function go(v,s=''){state.view=v;state.slug=s;state.running=null;location.hash=v+(s?'/'+s:'');draw();scrollTo({top:0,behavior:'smooth'})}
function imageFor(s){return `assets/${s}.png`}
function search(q){const w=q.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>1&&!STOP.includes(x));return T.map(t=>{let sc=0;w.forEach(x=>{if(t.tags.some(g=>g.includes(x)||x.includes(g)))sc+=2;if(t.c.toLowerCase().includes(x))sc+=2;if((t.n+t.d).toLowerCase().includes(x))sc++});return{t,sc}}).filter(x=>x.sc).sort((a,b)=>b.sc-a.sc).map(x=>x.t)}
function routeBadge(t,showGemini=true){const s=state.status[t.s];if(!s)return'';if(s.native_configured)return'<span class="status live">Native API ready</span>';if(showGemini&&s.gemini_configured&&t.s!=='heygen')return'<span class="status fallback">Gemini route ready</span>';if(showGemini&&t.s==='adcreative'&&s.gemini_configured)return'<span class="status fallback">Gemini route ready</span>';if(s.gemini_configured)return'';return'<span class="status need">Needs setup</span>'}
function card(t,top=false){return `<div class="card ${top?'top':''}"><div class="row"><img class="toolimg" src="${imageFor(t.s)}" alt=""><h3>${t.n}</h3></div><div class="mute">${t.c}</div><div>${t.d}</div>${top?`<div class="mute">Why this fits: ${t.w}</div>`:''}<div class="mute">${t.unit}</div><div style="margin-top:auto;padding-top:7px"><button class="btn sm" onclick="go('tool','${t.s}')">Use tool</button></div></div>`}
function orbit(){const rings=[[160,18,['gamma','chatprd','lovable']],[245,28,['heygen','elevenlabs','browseai']],[330,40,['fireflies','adcreative','typefully']]];return `<div class="orb" aria-hidden="true"><div class="core"><img src="assets/oneai-logo.png" alt=""></div>${rings.map(([d,sp,l],k)=>`<div class="ring" style="width:${d}px;height:${d}px;animation-duration:${sp}s;${k===1?'animation-direction:reverse':''}">${l.map((x,j)=>{const a=j/l.length*6.283+k;return `<span class="ib" style="left:${50+50*Math.cos(a)}%;top:${50+50*Math.sin(a)}%;animation-duration:${sp}s;${k===1?'':'animation-direction:reverse'}"><img src="${imageFor(x)}" alt="${tool(x).n}"></span>`}).join('')}</div>`).join('')}</div>`}
function marquee(){return `<div class="mq"><div class="mt">${[...T,...T].map(t=>`<span><img src="${imageFor(t.s)}" alt="">${t.n}<em>${t.c}</em></span>`).join('')}</div></div>`}
function renderCommand(){const c=state.command;if(!c)return'';if(c.kind==='loading')return `<div class="command-wrap"><div class="command-card"><b>OneAI is deciding the best route…</b><div class="bar"><i style="width:45%"></i></div><div class="mute">The same prompt can become a grounded search answer or launch a specialist tool.</div></div></div>`;if(c.kind==='needs')return `<div class="command-wrap"><div class="notice"><b>${esc(c.reason||'More input is required.')}</b><div class="mute" style="margin-top:5px">OneAI selected ${esc(tool(c.tool)?.n||c.tool)}.</div><div style="margin-top:10px"><button class="btn sm" onclick="go('tool','${esc(c.tool)}')">Open ${esc(tool(c.tool)?.n||c.tool)}</button></div></div></div>`;if(c.kind==='running')return `<div class="command-wrap"><div class="command-card"><div class="command-meta"><span class="route-chip">${esc(c.label||'OneAI')}</span><b>${c.status==='running'?'Working on it…':'Queued…'}</b></div><div class="bar"><i style="width:${c.status==='running'?70:30}%"></i></div><div class="mute">${esc(c.id)} · ${c.hold} credits reserved. The unused amount will be released after completion.</div></div></div>`;if(c.kind==='failed')return `<div class="command-wrap"><div class="err"><b>Task could not be completed. The full hold was released.</b><br>${esc(c.error||'The AI service is temporarily unavailable. Please try again shortly.')}<div class="rcpt"><div><span>Held</span><b>${c.hold}</b></div><div><span>Charged</span><b>0</b></div><div><span>Released</span><b>${c.released}</b></div></div></div></div>`;if(c.kind==='done'){const r=c.run||{},o=r.output||{},src=(o.sources||[]).slice(0,8).map(x=>`<a class="source" target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.title||x.url)}</a>`).join('');const outs=(o.outputs||[]).filter(x=>x.url).map(x=>`<a class="btn s sm" target="_blank" href="${esc(x.url)}">${esc(x.label||'Open output')}</a>`).join('');const answer=o.answer?`<div class="command-answer">${esc(o.answer)}</div>`:'';return `<div class="command-wrap"><div class="command-card"><div class="command-meta"><span class="route-chip">${esc(c.label||r.provider||'OneAI')}</span><b>Complete</b><span class="mute">${esc(r.provider||'')}</span></div>${answer}${src?`<div class="sources">${src}</div>`:''}${outs?`<div class="outlinks">${outs}</div>`:''}<div class="rcpt"><div><span>Held</span><b>${r.hold}</b></div><div><span>Charged</span><b>${r.charged}</b></div><div><span>Released</span><b>${r.released}</b></div></div><div class="mute" style="margin-top:8px">Bill status: ${esc(r.email_status)} · ${esc(r.id)}</div></div></div>`}return''}
function home(){const q=state.q.trim(),res=q?search(q):[],fl=q?FLOWS.find(f=>f.trig.some(x=>q.toLowerCase().includes(x))):null;let list=state.cat?T.filter(t=>t.c===state.cat):T;let h=`<section class="hero"><div class="hl"><span class="pill">One Wallet. All AI tools.</span><h1>Say the task. <span class="gr">We bring the right AI.</span></h1><p>Ask a question or describe the output you want. OneAI can search the live web with Gemini grounding or route the same prompt into the right specialist tool, reserve credits, generate the result, settle the bill and release the unused balance.</p><div class="sb"><input id="q" value="${esc(q)}" placeholder="Search the web, create a deck, build an app…" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn" id="askbtn" onclick="doSearch()">Ask / Run</button></div><div class="emailmini"><input id="command_email" type="email" value="${esc(state.email)}" placeholder="Billing email for generated tasks"><span class="mute">Used for the usage bill.</span></div><div class="searchhelp">Examples: “latest EV policy changes in India” · “make a 10-slide investor deck on my startup” · “write a LinkedIn launch post”</div><div class="chips">${CATS.map(c=>`<span class="chip ${state.cat===c?'on':''}" onclick="state.cat=state.cat==='${c}'?'':'${c}';state.q='';state.command=null;draw()">${c}</span>`).join('')}</div></div>${orbit()}</section>${renderCommand()}${marquee()}`;
if(q&&!state.command){h+=`<h2>Suggested tools for: ${esc(q)}</h2>`;if(fl)h+=`<div class="flow"><b>${fl.n} workflow</b>${fl.steps.map((s,i)=>`${i?'→':''}<span class="t" onclick="go('tool','${s}')">${tool(s).n}</span>`).join('')}<span class="mute">Each step reserves and settles credits independently.</span></div>`;h+=res.length?`<div class="grid" style="margin-top:14px">${res.slice(0,5).map((t,i)=>card(t,i===0)).join('')}</div>`:`<div class="empty">No strong match. Pick a category above.</div>`}else{h+=`<h2>${state.cat||'Popular tools'}</h2><div class="grid">${(state.cat?list:T.slice(2,8)).map(t=>card(t)).join('')}</div>`;if(!state.cat)h+=`<h2>All tools</h2><div class="grid">${T.map(t=>card(t)).join('')}</div>`}return h}

function fieldHtml([k,l,ty,d]){if(ty==='area')return `<label>${l}</label><textarea id="f_${k}" rows="4">${esc(d)}</textarea>`;if(ty==='sel')return `<label>${l}</label><select id="f_${k}">${d.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;if(ty==='file')return `<label>${l}</label><input class="f" id="f_${k}" type="file" accept="audio/*,video/*"><div class="mute tiny">Max 25 MB in this prototype.</div>`;return `<label>${l}</label><input class="f" id="f_${k}" type="${ty==='num'?'number':'text'}" value="${esc(d)}">`}
function toolPage(){const t=tool(state.slug);if(!t)return'<div class="empty">Tool not found.</div>';const s=state.status[t.s]||{};return `<p><a class="mute" style="cursor:pointer" onclick="go('')">← All tools</a></p><div class="row"><img class="toolimg big" src="${imageFor(t.s)}" alt=""><div><h1 style="margin:0">${t.n}</h1><div class="mute">${t.c}</div></div>${routeBadge(t)}</div><p>${t.d}</p><div class="notice"><b>What this vertical does:</b> ${esc(s.mission||t.w)}<br><span class="mute"><b>Backend route:</b> ${esc(s.note||'Loading integration status…')}</span></div><div class="two" style="margin-top:16px"><div class="card" id="form">${t.f.map(fieldHtml).join('')}<label>Send the bill to</label><input class="f" id="em" type="email" value="${esc(state.email)}" placeholder="you@example.com"><p class="mute">Your provider keys never enter the browser. They are read from server environment variables.</p></div><div><div class="est" id="est"><div class="mute">Estimated hold</div><div class="big">${estimateClient(t)} credits</div><p class="mute">This includes a 25% reservation buffer. The final usage is captured after the provider finishes and the remainder is released.</p><p>Available now: <b>${state.wallet?state.wallet.available:'…'}</b></p><button class="btn" id="runbtn" onclick="startRun()">Run ${t.n}</button></div><div id="runstatus"></div></div></div>`}
function estimateClient(t){let base=10;if(t.s==='gamma')base=3*Math.max(1,Math.min(30,+document.getElementById?.('f_n')?.value||10));else if(t.s==='elevenlabs')base=Math.max(1,.03*(document.getElementById?.('f_text')?.value?.length||t.f[0][3].length));else if(t.s==='fireflies')base=Math.max(2,.8*(+document.getElementById?.('f_min')?.value||30));else if(t.s==='heygen')base=Math.max(5,40*Math.max(.125,(document.getElementById?.('f_script')?.value?.length||t.f[0][3].length)/900));else base={lovable:30,chatprd:15,browseai:12,adcreative:25,typefully:2}[t.s]||10;return Math.round(base*1.25*100)/100}
function getInput(t){const o={};for(const [k,,ty,d] of t.f){if(ty==='file')continue;const e=document.getElementById('f_'+k);o[k]=e?e.value:(ty==='sel'?d[0]:d)}return o}
async function startRun(){const t=tool(state.slug),btn=document.getElementById('runbtn'),st=document.getElementById('runstatus');btn.disabled=true;try{const inp=getInput(t);if(t.s==='fireflies'){const f=document.getElementById('f_meeting_file').files[0];if(!f)throw new Error('Choose a meeting audio or video file first.');st.innerHTML='<div class="card" style="margin-top:12px"><b>Uploading…</b></div>';const fd=new FormData();fd.append('file',f);const up=await api('/api/uploads',{method:'POST',body:fd});inp.upload_id=up.upload_id}const email=document.getElementById('em').value.trim();state.email=email;localStorage.setItem('oneai_email',email);const r=await api('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:t.s,input:inp,email})});state.running=r.id;st.innerHTML=`<div class="card" style="margin-top:12px"><b id="stl">Credits reserved · queued</b><div class="bar"><i id="pb"></i></div><div class="mute">Run ${r.id}. You can leave this screen; the run is recorded in My Runs.</div></div>`;await refreshWallet();pollRun(r.id)}catch(e){btn.disabled=false;st.innerHTML=`<div class="err" style="margin-top:12px">${esc(e.message)}</div>`;if(e.status===402)toast('Top up credits to continue')}}
async function pollRun(id){const t=tool(state.slug),st=document.getElementById('runstatus');try{const r=await api('/api/runs/'+encodeURIComponent(id));if(!st)return;if(r.status==='queued'||r.status==='running'){const p=r.status==='running'?65:28;st.innerHTML=`<div class="card" style="margin-top:12px"><b>${r.status==='running'?'Provider is working…':'Queued…'}</b><div class="bar"><i style="width:${p}%"></i></div><div class="mute">${id} · ${r.hold} credits reserved</div></div>`;setTimeout(()=>pollRun(id),1600);return}await refreshWallet();if(r.status==='failed'){st.innerHTML=`<div class="err" style="margin-top:12px"><b>Run could not be completed. Full hold released.</b><br>${esc(r.error||'The AI service is temporarily unavailable. Please try again shortly.')}<div class="rcpt"><div><span>Held</span><b>${r.hold}</b></div><div><span>Charged</span><b>0</b></div><div><span>Released</span><b>${r.released}</b></div></div><div class="mute" style="margin-top:8px">Bill status: ${esc(r.email_status)}</div></div>`;document.getElementById('runbtn').disabled=false;return}const outs=(r.output?.outputs||[]).filter(o=>o.url).map(o=>`<a class="btn s sm" target="_blank" href="${esc(o.url)}">${esc(o.label||'Open output')}</a>`).join('');st.innerHTML=`<div class="okbox" style="margin-top:12px"><b>Run complete</b><div class="mute" style="margin-top:4px">Provider: ${esc(r.provider)}</div><div class="outlinks">${outs}</div><div class="rcpt"><div><span>Held</span><b>${r.hold}</b></div><div><span>Charged</span><b>${r.charged}</b></div><div><span>Released</span><b>${r.released}</b></div></div><div class="mute" style="margin-top:8px">Bill status: ${esc(r.email_status)} · ${r.id}</div></div>`;document.getElementById('runbtn').disabled=false}catch(e){st.innerHTML=`<div class="err" style="margin-top:12px">Could not refresh this run: ${esc(e.message)}</div>`;document.getElementById('runbtn').disabled=false}}
async function walletPage(){if(!state.wallet)await refreshWallet();const w=state.wallet;return `<h1>OneAI Wallet</h1><div class="bal"><div><span class="mute">Total credits</span><b>${w.balance}</b></div><div><span class="mute">Reserved</span><b>${w.reserved}</b></div><div><span class="mute">Available</span><b>${w.available}</b></div></div><p class="mute">Prototype accounting only. A run reserves credits first; final usage is charged only after completion, and unused reserved credits are released.</p><h2>Top up test credits</h2><div class="row">${[100,250,500,1000].map(a=>`<button class="btn s" onclick="topup(${a})">+${a}</button>`).join('')}</div><h2>Transactions</h2><div class="sc"><table><tr><th>Reference</th><th>Type</th><th>Credits</th><th>Run</th><th>Note</th><th>Time</th></tr>${w.ledger.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.type)}</td><td class="${x.amount>=0?'pos':'neg'}">${x.amount>0?'+':''}${x.amount}</td><td>${esc(x.run_id||'-')}</td><td>${esc(x.note)}</td><td>${esc(x.created_at)}</td></tr>`).join('')}</table></div>`}
async function topup(amount){try{await api('/api/wallet/topup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount})});await refreshWallet();draw();toast(`Added ${amount} test credits`)}catch(e){toast(e.message)}}
async function runsPage(){const d=await api('/api/runs');return `<h1>My Runs</h1>${d.runs.length?`<div class="sc"><table><tr><th>Tool</th><th>Status</th><th>Provider</th><th>Held</th><th>Charged</th><th>Released</th><th>Output</th><th>Time</th></tr>${d.runs.map(r=>`<tr><td>${esc(tool(r.tool)?.n||r.tool)}</td><td>${esc(r.status)}</td><td>${esc(r.provider||'-')}</td><td>${r.hold}</td><td>${r.charged}</td><td>${r.released}</td><td>${(r.output?.outputs||[]).filter(o=>o.url).map(o=>`<a target="_blank" style="text-decoration:underline" href="${esc(o.url)}">${esc(o.label)}</a>`).join('<br>')||esc(r.error||'-')}</td><td>${esc(r.created_at)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No runs yet.</div>'}`}
async function mailPage(){const d=await api('/api/mail');return `<h1>Billing mail log</h1><p class="mute">With RESEND_API_KEY and RESEND_FROM configured, these bills are actually sent. Otherwise they remain here as an auditable outbox record.</p>${d.mail.length?d.mail.map(m=>`<details class="card" style="margin-bottom:10px"><summary><b>${esc(m.subject)}</b> <span class="status ${m.status==='sent'?'live':'need'}">${esc(m.status)}</span></summary><div class="mute">to ${esc(m.recipient)} · ${esc(m.created_at)}</div><pre style="white-space:pre-wrap;font:inherit">${esc(m.body)}</pre></details>`).join(''):'<div class="empty">No bills yet.</div>'}`}
function integrationsPage(){const rows=T.map(t=>{const s=state.status[t.s]||{};return `<div class="card"><div class="row"><img class="toolimg" src="${imageFor(t.s)}"><h3>${t.n}</h3>${routeBadge(t)}</div><div>${esc(s.mission||'')}</div><div class="mute">${esc(s.note||'')}</div><div class="tiny"><b>Server secret:</b> ${esc(s.env||'Gemini route only')}</div></div>`}).join('');return `<h1>Backend integrations</h1><div class="okbox">API keys are intentionally not editable here. Put them in your server environment variables or Railway Variables. This prevents browser users from seeing or stealing provider secrets.</div><div class="grid" style="margin-top:16px">${rows}</div>`}
async function refreshWallet(){try{state.wallet=await api('/api/wallet');document.getElementById('wal').textContent=state.wallet.available+' credits'}catch(e){document.getElementById('wal').textContent='Wallet offline'}}
function head(){document.getElementById('nav').innerHTML=[['','Discover'],['wallet','Wallet'],['runs','My Runs'],['mail','Bills'],['integrations','Integrations']].map(([v,l])=>`<a class="${state.view===v||(v===''&&state.view==='tool')?'on':''}" onclick="go('${v}')">${l}</a>`).join('')}
async function draw(){head();const a=document.getElementById('app');try{if(state.view==='tool')a.innerHTML=toolPage();else if(state.view==='wallet')a.innerHTML=await walletPage();else if(state.view==='runs')a.innerHTML=await runsPage();else if(state.view==='mail')a.innerHTML=await mailPage();else if(state.view==='integrations')a.innerHTML=integrationsPage();else a.innerHTML=home()}catch(e){a.innerHTML=`<div class="err">${esc(e.message)}</div>`}}
async function doSearch(){const e=document.getElementById('q'),q=(e?.value||'').trim();if(!q)return toast('Enter a question or task');const em=(document.getElementById('command_email')?.value||state.email||'').trim();if(em){state.email=em;localStorage.setItem('oneai_email',em)}state.q=q;state.cat='';state.command={kind:'loading'};draw();try{const d=await api('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q,email:state.email})});if(d.action==='needs_input'){state.command={kind:'needs',tool:d.tool,reason:d.reason,input:d.input};draw();return}state.commandRun=d.id;state.command={kind:'running',id:d.id,hold:d.hold,status:'queued',label:d.route?.mode==='search'?'OneAI Search':(tool(d.route?.tool)?.n||'OneAI')};await refreshWallet();draw();pollCommand(d.id)}catch(err){state.command={kind:'failed',error:err.message,hold:0,released:0};draw();if(err.status===402)toast('Top up credits to continue')}}
async function pollCommand(id){try{const r=await api('/api/runs/'+encodeURIComponent(id));if(r.status==='queued'||r.status==='running'){state.command={...state.command,kind:'running',status:r.status,id:r.id,hold:r.hold};draw();setTimeout(()=>pollCommand(id),1500);return}await refreshWallet();if(r.status==='failed'){state.command={kind:'failed',error:r.error,hold:r.hold,released:r.released};draw();return}const label=r.tool==='oneai_search'?'OneAI Search':(tool(r.tool)?.n||r.tool);state.command={kind:'done',label,run:r};draw()}catch(err){state.command={kind:'failed',error:'Could not refresh task: '+err.message,hold:0,released:0};draw()}}

addEventListener('hashchange',()=>{const[h,s]=location.hash.slice(1).split('/');state.view=h||'';state.slug=s||'';draw()});
document.addEventListener('input',e=>{if(e.target?.id==='f_n'||e.target?.id==='f_text'||e.target?.id==='f_min'||e.target?.id==='f_script'){const x=document.querySelector('#est .big');if(x)x.textContent=estimateClient(tool(state.slug))+' credits'}});
document.addEventListener('mousemove',e=>{const h=document.querySelector('.hero');if(h){const r=h.getBoundingClientRect();h.style.setProperty('--mx',e.clientX-r.left+'px');h.style.setProperty('--my',e.clientY-r.top+'px')}});
(async()=>{const[h,s]=location.hash.slice(1).split('/');state.view=h||'';state.slug=s||'';try{const d=await api('/api/tools');state.status=Object.fromEntries(d.tools.map(x=>[x.slug,x]));await refreshWallet()}catch(e){toast('Backend connection failed: '+e.message)}draw()})();
</script>
</body>
</html>
